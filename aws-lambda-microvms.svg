<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="960" viewBox="0 0 1420 960"><rect width="1420" height="960" fill="white" /><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#555" /></marker></defs><rect x="250" y="20" width="1150" height="910" fill="none" stroke="#232f3e" /><text font-family="Arial" font-size="17" text-anchor="start" x="270" y="48">AWS Cloud - provisioned with Terraform</text><text font-family="Arial" font-size="14" text-anchor="start" x="1110" y="110">Both sessions launch from</text><text font-family="Arial" font-size="14" text-anchor="start" x="1110" y="133">the initialized image above.</text><text font-family="Arial" font-size="13" text-anchor="start" x="270" y="953">Control-plane polling does not wake a VM. Runtime VMs have no AWS execution role. Session state is ephemeral.</text><polyline marker-end="url(#arrow)" points="120,390 120,125 280,125" fill="none" stroke="#555" /><text font-family="Arial" font-size="11" text-anchor="start" x="125" y="250">assets</text><polyline marker-end="url(#arrow)" points="180,390 180,285 280,285" fill="none" stroke="#555" /><text font-family="Arial" font-size="11" text-anchor="start" x="185" y="345">login</text><polyline marker-end="url(#arrow)" points="220,455 280,455" fill="none" stroke="#555" /><text font-family="Arial" font-size="11" text-anchor="start" x="240" y="393">access token</text><polyline marker-end="url(#arrow)" points="500,455 560,455" fill="none" stroke="#555" /><polyline marker-end="url(#arrow)" points="780,455 840,455" fill="none" stroke="#555" /><text font-family="Arial" font-size="11" text-anchor="start" x="790" y="397">enqueue</text><polyline marker-end="url(#arrow)" points="1050,455 1110,455" fill="none" stroke="#555" /><polyline marker-end="url(#arrow)" points="650,500 650,640" fill="none" stroke="#555" /><text font-family="Arial" font-size="11" text-anchor="start" x="655" y="565">metadata</text><polyline marker-end="url(#arrow)" points="1110,480 1085,480 1085,690 780,690" fill="none" stroke="#555" /><text font-family="Arial" font-size="11" text-anchor="start" x="840" y="680">save result</text><polyline marker-end="url(#arrow)" points="1240,500 1240,630" fill="none" stroke="#555" /><text font-family="Arial" font-size="11" text-anchor="start" x="1245" y="575">AWS SDK</text><polyline marker-end="url(#arrow)" points="1170,500 1170,565 960,565 960,800" fill="none" stroke="#555" /><text font-family="Arial" font-size="11" text-anchor="start" x="810" y="783">VM-authenticated HTTPS</text><polyline marker-end="url(#arrow)" points="1350,455 1385,455 1385,760 1240,760 1240,800" fill="none" stroke="#555" /><text font-family="Arial" font-size="11" text-anchor="start" x="1285" y="783">HTTPS</text><polyline marker-end="url(#arrow)" points="780,125 840,125" fill="none" stroke="#555" /><text font-family="Arial" font-size="11" text-anchor="start" x="790" y="112">build</text><polyline marker-end="url(#arrow)" points="720,500 720,600 1045,600 1045,750 1200,750 1200,720" fill="none" stroke="#555" /><text font-family="Arial" font-size="11" text-anchor="start" x="725" y="590">GetMicrovm only</text><rect x="20" y="390" width="200" height="90" fill="#dae8fc" stroke="#666" /><text font-family="Arial" font-size="14" text-anchor="middle" x="120.0" y="429.0">Browser</text><text font-family="Arial" font-size="14" text-anchor="middle" x="120.0" y="451.0">No local server</text><rect x="280" y="80" width="220" height="90" fill="#d5e8d4" stroke="#666" /><text font-family="Arial" font-size="14" text-anchor="middle" x="390.0" y="119.0">S3 HTTPS frontend</text><text font-family="Arial" font-size="14" text-anchor="middle" x="390.0" y="141.0">HTML + JS + config</text><rect x="280" y="240" width="220" height="90" fill="#e1d5e7" stroke="#666" /><text font-family="Arial" font-size="14" text-anchor="middle" x="390.0" y="279.0">Cognito Hosted UI</text><text font-family="Arial" font-size="14" text-anchor="middle" x="390.0" y="301.0">Code + PKCE login</text><rect x="280" y="410" width="220" height="90" fill="#e1d5e7" stroke="#666" /><text font-family="Arial" font-size="14" text-anchor="middle" x="390.0" y="449.0">API Gateway</text><text font-family="Arial" font-size="14" text-anchor="middle" x="390.0" y="471.0">JWT + required scope</text><rect x="560" y="410" width="220" height="90" fill="#ffe6cc" stroke="#666" /><text font-family="Arial" font-size="14" text-anchor="middle" x="670.0" y="449.0">Controller Lambda</text><text font-family="Arial" font-size="14" text-anchor="middle" x="670.0" y="471.0">Submit / poll status</text><rect x="560" y="640" width="220" height="100" fill="#dae8fc" stroke="#666" /><text font-family="Arial" font-size="14" text-anchor="middle" x="670.0" y="673.0">DynamoDB</text><text font-family="Arial" font-size="14" text-anchor="middle" x="670.0" y="695.0">IDs, observations, jobs</text><text font-family="Arial" font-size="14" text-anchor="middle" x="670.0" y="717.0">No interpreter restore</text><rect x="840" y="410" width="210" height="90" fill="#f8cecc" stroke="#666" /><text font-family="Arial" font-size="14" text-anchor="middle" x="945.0" y="449.0">SQS FIFO</text><text font-family="Arial" font-size="14" text-anchor="middle" x="945.0" y="471.0">Serialized operations</text><rect x="1110" y="410" width="240" height="90" fill="#ffe6cc" stroke="#666" /><text font-family="Arial" font-size="14" text-anchor="middle" x="1230.0" y="449.0">Worker Lambda</text><text font-family="Arial" font-size="14" text-anchor="middle" x="1230.0" y="471.0">MicroVM tokens stay here</text><rect x="1110" y="630" width="240" height="90" fill="#ffe6cc" stroke="#666" /><text font-family="Arial" font-size="14" text-anchor="middle" x="1230.0" y="669.0">Lambda MicroVM API</text><text font-family="Arial" font-size="14" text-anchor="middle" x="1230.0" y="691.0">Lifecycle + tokens</text><rect x="560" y="80" width="220" height="90" fill="#d5e8d4" stroke="#666" /><text font-family="Arial" font-size="14" text-anchor="middle" x="670.0" y="119.0">Private S3 source</text><text font-family="Arial" font-size="14" text-anchor="middle" x="670.0" y="141.0">Dockerfile + Python</text><rect x="840" y="80" width="250" height="90" fill="#ffe6cc" stroke="#666" /><text font-family="Arial" font-size="14" text-anchor="middle" x="965.0" y="119.0">Initialized image</text><text font-family="Arial" font-size="14" text-anchor="middle" x="965.0" y="141.0">Memory + disk snapshot</text><rect x="820" y="800" width="260" height="100" fill="#d5e8d4" stroke="#666" /><text font-family="Arial" font-size="14" text-anchor="middle" x="950.0" y="833.0">Alice MicroVM</text><text font-family="Arial" font-size="14" text-anchor="middle" x="950.0" y="855.0">Interpreter + RAM + files</text><text font-family="Arial" font-size="14" text-anchor="middle" x="950.0" y="877.0">HTTPS :8080 / hooks :8081</text><rect x="1110" y="800" width="260" height="100" fill="#dae8fc" stroke="#666" /><text font-family="Arial" font-size="14" text-anchor="middle" x="1240.0" y="833.0">Bob MicroVM</text><text font-family="Arial" font-size="14" text-anchor="middle" x="1240.0" y="855.0">Interpreter + RAM + files</text><text font-family="Arial" font-size="14" text-anchor="middle" x="1240.0" y="877.0">HTTPS :8080 / hooks :8081</text></svg>